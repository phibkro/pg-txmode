# The one secret the release workflow reads (spec 0006). Declared by name only: no value is stored in the repository.
# It lives as the environment secret NPM_TOKEN of the GitHub environment `npm-release` (restricted to `main`, reviewer
# phibkro). Remove it with the token, see the spec's Revisions.
[project]
name = "pg-txmode"
revision = "1.0"

[profiles.default]
NPM_TOKEN = { description = "Granular npm access token (read and write, scope @pg-txmode, expires) used by .github/workflows/release.yml to publish", required = true }
