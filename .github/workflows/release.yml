# Publishes the five @pg-txmode/* packages using npm trusted publishing (spec 0010).
# Check dry-runs the artifacts; publish requires the npm-release environment approval.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check: dry-run each package; publish: publish via OIDC."
        type: choice
        options: [check, publish]
        default: check

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # No step runs a publish command without --dry-run, and the publish job below does not run in this mode.
    if: inputs.mode == 'check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        shell: bash
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Install workspace dependencies
        shell: bash
        run: devenv shell -- bun install --frozen-lockfile
      - name: Build what is published
        shell: bash
        run: devenv shell -- bun run release:stage
      - name: Dry-run publish of each package (no token)
        shell: bash
        # Runs from outside the checkout: npm refuses to run below a root package.json whose devEngines.packageManager
        # names another tool (EBADDEVENGINES). A dry run does not authenticate: it proves the tarball and the manifest
        # are accepted by npm's client, not that trusted publishing is authorized.
        run: |
          tag=$(jq -r 'if .mode == "pre" then .tag else "latest" end' .changeset/pre.json 2>/dev/null || echo latest)
          cd "$RUNNER_TEMP"
          for manifest in "$GITHUB_WORKSPACE"/packages/*/dist/package.json; do
            dist=$(dirname "$manifest")
            echo "::group::$(jq -r .name "$manifest")@$(jq -r .version "$manifest") (tag $tag)"
            npm publish "$dist" --dry-run --tag "$tag" --access public
            echo "::endgroup::"
          done
          # What the registry says now (public reads): after a first publish, `latest` may sit on an alpha (spec 0006).
          for manifest in "$GITHUB_WORKSPACE"/packages/*/dist/package.json; do
            name=$(jq -r .name "$manifest")
            if out=$(npm view "$name" dist-tags --json 2>&1); then echo "$name dist-tags: $out"; else echo "$name: not on the registry yet"; fi
          done

  publish:
    # Only the head of main is released; the check below ties the commit to a green `checks` run.
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      checks: read
      id-token: write # npm trusted publishing (OIDC) and the provenance attestation
    env:
      # A publish that cannot produce provenance fails instead of publishing without it.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Release hold
        shell: bash
        # While .github/release-hold exists nothing below runs: a published npm name and version are permanent, so the
        # first publish is an operator decision. A pull request that deletes the file lifts it.
        run: |
          if [ -e .github/release-hold ]; then
            echo "::error::the npm release is on hold: .github/release-hold exists"
            cat .github/release-hold
            exit 1
          fi
      - name: The commit passed the checks workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "checks") | .conclusion] | first // "none"')
          echo "checks on $GITHUB_SHA: $conclusion"
          test "$conclusion" = success
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        shell: bash
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Install workspace dependencies
        shell: bash
        run: devenv shell -- bun install --frozen-lockfile
      - name: npm supports trusted publishing
        shell: bash
        # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later (docs.npmjs.com/trusted-publishers).
        run: |
          devenv shell -- bash -c '
            version=$(npm --version)
            printf "%s\n" "11.5.1" "$version" | sort -V -C || { echo "npm $version is older than 11.5.1"; exit 1; }
            echo "npm $version"
          '
      - name: Build what is published
        shell: bash
        # Writes packages/*/dist: bundled ESM, declarations, a generated package.json, LICENSE, NOTICE. Fails when a
        # package would ship a file that is not built output.
        run: devenv shell -- bun run release:stage
      - name: npm may run in this checkout
        shell: bash
        # npm refuses to run anywhere in a repository whose root package.json has `devEngines.packageManager` for another
        # tool (EBADDEVENGINES, bun here), so the field is removed from this runner's checkout, which is discarded when
        # the job ends.
        run: |
          jq 'del(.devEngines)' package.json > package.json.release
          mv package.json.release package.json
      - name: Publish
        shell: bash
        # One `npm publish ./packages/<name>/dist --tag <tag> --access public` for each version the registry lacks, core
        # first, stopping at the first failure (a re-run skips what is already there). The tag is `alpha` while
        # .changeset/pre.json is in pre mode, else `latest`. Changesets only versions: `changeset publish` tags a
        # package `latest` once an earlier alpha exists (@changesets/cli getReleaseTag, 'only-pre'), and refuses
        # `--tag` in pre mode, so `npm i @pg-txmode/core@alpha` would stop moving after the first release (spec 0006,
        # Revisions 5). `npm view` uses public registry reads.
        run: |
          devenv shell -- bash -c '
            set -eu
            tag=latest
            if [ -f .changeset/pre.json ]; then
              tag=$(node -p "const p = require(\"./.changeset/pre.json\"); p.mode === \"pre\" ? p.tag : \"latest\"")
            fi
            for manifest in packages/*/dist/package.json; do
              dir=$(dirname "$manifest")
              name=$(node -p "require(\"./$manifest\").name")
              version=$(node -p "require(\"./$manifest\").version")
              if out=$(npm view "$name@$version" version 2>&1); then
                echo "$name@$version is on the registry: skipped"
              elif printf "%s\n" "$out" | grep -q "^npm error code E404"; then
                echo "$name@$version is not on the registry: publishing"
                npm publish "./$dir" --tag "$tag" --access public
              else
                echo "npm view $name@$version failed, not E404; nothing is published for it:"
                printf "%s\n" "$out"
                exit 1
              fi
            done
          '
